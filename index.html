.next{background:var(--sel);margin:0 -8px;padding:12px 8px;border-radius:16px}
.mini{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--room);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}

  m.appendChild(b);m.appendChild(mk("span",null,rn(i.room)+" · "+t.floor+ROOMS[i.room].f+(i.who?" · "+tx(i.who):"")));
  var g=mk("button","mini",t.gh);g.onclick=function(){S.sub[0]=ROOMS[i.room].f-1;S.tab=0;pick(i.room);$("go").click();sync(true)};
  d.appendChild(mk("div","time",i.time));d.appendChild(m);d.appendChild(g);
  if(mine){var x=mk("button","mini",t.rm);x.setAttribute("aria-label",t.rm+" "+i.title);x.onclick=function(){S.items=S.items.filter(function(z){return z.id!==i.id});save();drawList();say(t.removed)};d.appendChild(x)}
  box.appendChild(d)});
}
$("save").onclick=function(){
 var t=$("f-title").value.trim();
 if(!t){say(T().needT);$("f-title").focus();return}
 S.items.push({id:"u"+Date.now(),time:$("f-time").value||"12:00",title:t,room:$("f-room").value,who:S.L==="de"?"Sie":"You"});
 save();$("f-title").value="";drawList();info();S.tab=1;S.sub[1]=0;sync(true);say(T().added)};
$("mascot").onclick=function(){var a=T().tips;say(a[Math.floor(Math.random()*a.length)])};

function theme(dark){document.documentElement.setAttribute("data-theme",dark?"dark":"light");$("dm").setAttribute("aria-checked",dark);try{localStorage.setItem("dark",dark?"1":"0")}catch(e){}}
$("dm").onclick=function(){theme($("dm").getAttribute("aria-checked")!=="true")};
$("vo").onclick=function(){S.voice=!S.voice;$("vo").setAttribute("aria-checked",S.voice);if(S.voice)speak(T().tips[0]);else if(window.speechSynthesis)speechSynthesis.cancel()};
function qr(){var b=$("qr");b.innerHTML="";try{new QRCode(b,{text:(S.shareUrl||location.href.split("#")[0]),width:160,height:160,colorDark:"#0b1b4a",colorLight:"#ffffff"})}catch(e){b.textContent="QR"}}

function sync(quiet){
 var n=S.tab,sub=S.sub[n],names=T()["s"+n];
 var show=n===0?"p-plan":n===1?(sub===0?"p-agenda":"p-add"):"p-set";
 ["p-plan","p-agenda","p-add","p-set"].forEach(function(id){$(id).classList.toggle("on",id===show)});
 if(n===0&&S.floor!==sub+1){S.floor=sub+1;drawPlan()}
 if(n===2){$("set-display").style.display=sub===0?"block":"none";$("set-share").style.display=sub===1?"block":"none";if(sub===1)qr()}
 var sn=$("subnav");sn.style.setProperty("--n",names.length);
 sn.querySelectorAll("button").forEach(function(b){b.remove()});
 names.forEach(function(nm,i){var b=mk("button",null,nm);b.setAttribute("aria-pressed",i===sub);b.onclick=function(){S.sub[n]=i;sync()};sn.appendChild(b)});
 sn.querySelector(".hl").style.transform="translateX("+(sub*100)+"%)";
 $("mainnav").querySelector(".hl").style.transform="translateX("+(n*100)+"%)";
 $("mainnav").querySelectorAll("button").forEach(function(b,i){b.setAttribute("aria-current",i===n?"page":"false")});
 if(!quiet)say(T().tips[n===2?(sub===0?3:4):n===1?(sub?2:1):0]);
}
$("mainnav").querySelectorAll("button").forEach(function(b){b.onclick=function(){S.tab=+b.dataset.tab;sync()}});

function applyLang(){
 var t=T();document.documentElement.lang=S.L;
 document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=t[e.dataset.i18n]});
 document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t[e.dataset.ph]});
 document.querySelectorAll("[data-aria]").forEach(function(e){e.setAttribute("aria-label",t.aria[e.dataset.aria])});
 document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===S.L)});
 var h=new Date().getHours();$("hello").textContent=(h<12?t.gm:h<18?t.ga:t.ge)+", CEO";
 $("date").textContent=new Date().toLocaleDateString(S.L==="de"?"de-CH":"en-GB",{weekday:"long",day:"numeric",month:"long"});
 var fr=$("f-room"),cur=fr.value;fr.innerHTML="";Object.keys(NM).forEach(function(k){var o=mk("option",null,rn(k));o.value=k;fr.appendChild(o)});if(cur)fr.value=cur;
 drawPlan();drawList();info();sync(true);$("bubble").textContent=t.tips[0];
}
function setLang(l){S.L=l;try{localStorage.setItem("lang",l)}catch(e){}applyLang();if(window.speechSynthesis)speechSynthesis.cancel();speak(T().tips[0])}
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
function begin(v){S.voice=v;$("vo").setAttribute("aria-checked",v);$("welcome").classList.add("off");if(v)speak(T().spoken)}
$("w-voice").onclick=function(){begin(true)};$("w-mute").onclick=function(){begin(false)};
$("wbernie").innerHTML=document.querySelector(".mascot").innerHTML;
try{var dk=localStorage.getItem("dark");if(dk==="1")theme(true);else if(dk==="0")theme(false);else $("dm").setAttribute("aria-checked",matchMedia("(prefers-color-scheme:dark)").matches)}catch(e){}
if(window.speechSynthesis)speechSynthesis.getVoices();
applyLang();
function loadServer(){
 try{fetch("api/info").then(function(r){return r.json()}).then(function(i){if(i&&i.url&&/^(localhost|127\.)/.test(location.hostname))S.shareUrl=i.url}).catch(function(){});
  fetch("api/agenda").then(function(r){return r.json()}).then(function(a){if(Array.isArray(a)){S.items=a;try{localStorage.setItem("agenda",JSON.stringify(a))}catch(e){}drawList();info()}else save()}).catch(function(){})}catch(e){}
 try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
loadServer();
</script>
